# Runs the backend in Docker on your own computer (optional — Render builds the Dockerfile itself).
# Put your variables in Backend/.env first, then: docker compose up --build
services:
  api:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - ./Backend/.env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
